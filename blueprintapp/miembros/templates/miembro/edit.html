{% extends 'base.html' %}
{% block title %}EDITAR - MIEMBRO{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-info text-white">
        <h2 class="h5 mb-2">Editar Miembro</h2>
    </div>
    <div class="card-body">
        <form action="{{ url_for('bp_miembro.edit_miembro', id_miembro=miembro.id)}}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Nombre"
                    value="{{ miembro.nombre }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="Email"
                    value="{{ miembro.email }}" required>
            </div>

            <button type="submit" class="btn btn-success">Actualizar</button>
            <a href="{{ url_for('bp_miembro.index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
