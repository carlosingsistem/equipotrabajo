{% extends "base.html" %}
{% block title %}MIEMBROS{% endblock %}

{% block content %}
<h2 class="mb-3">Listado de Miembros</h2>
<a href="{{ url_for('bp_miembro.create') }}" class="btn btn-success btn-sm mb-3">NUEVO MIEMBRO</a>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
    </thead>
    {% for item in miembros %}
    <tbody>
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ item.nombre }}</td>
            <td>{{ item.email }}</td>
            <td>
                <a href="{{ url_for('bp_miembro.edit_miembro', id_miembro=item.id) }}" class="btn btn-warning btn-sm">
                    EDITAR</a>

                <a href="{{ url_for('bp_miembro.delete_miembro', id_miembro=item.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('Esta seguro? No se podra revertir esta accion')">
                    ELIMINAR</a>
            </td>
        </tr>

        {% else %}
        <tr>
            <td colspan="5"><p class="text-center">No hay registros</p></td>
        </tr>

        {% endfor %}
    </tbody>
</table>

{% endblock %}
