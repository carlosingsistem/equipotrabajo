{% extends 'base.html' %}
{% block title %}EDITAR - TAREA{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-warning text-white">
        <h2 class="h5 mb-2">Editar Tarea</h2>
    </div>
    <div class="card-body">
        <form action="{{ url_for('bp_tarea.edit_tarea', id_tarea=tarea.id)}}" method="post">
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripcion:</label>
                <input type="text" class="form-control" name="descripcion" id="descripcion" placeholder="Descripcion" value="{{ tarea.descripcion }}" required>
            </div>
            <div class="mb-3">
                <input type="checkbox" class="form-check-input" name="completado" id="completado" {% if tarea.completado %}checked{% endif %}>
                <label for="completado" class="form-label">Completado</label>
            </div>

            <button type="submit" class="btn btn-success">Actualizar</button>
            <a href="{{ url_for('bp_tarea.index') }}" class="btn btn-info">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
